# Builds the site and runs scripts/check-site.mjs on every push to main and on
# every pull request. A red ✗ next to a commit on GitHub (and an email to the
# person who pushed) means something in that change broke the site — for
# example a missing image or a page without a description. It does not stop
# Cloudflare from deploying; it tells you quickly so it can be fixed.
# (To make it a gate, protect `main` in GitHub settings and require this check.)

name: Build check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (pinned)

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (pinned)
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      - name: Check the built site
        run: npm run check
